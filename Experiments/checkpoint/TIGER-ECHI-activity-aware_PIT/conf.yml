audionet:
  audionet_config:
    in_channels: 256
    num_blocks: 8
    num_sources: 4
    out_channels: 128
    stride: 160
    upsampling_depth: 5
    win: 640
  audionet_name: TSE_TIGER
datamodule:
  data_config:
    batch_size: 1
    n_src: 4
    num_workers: 8
    persistent_workers: false
    pin_memory: true
    sample_rate: 16000
    segment: 3.0
    test_dir: /no_backups/s1495/Processed_ECHI/ha/eval
    train_dir: /no_backups/s1495/Processed_ECHI/ha/train
    valid_dir: /no_backups/s1495/Processed_ECHI/ha/dev
  data_name: ECHIDataModule
exp:
  exp_name: TIGER-ECHI-activity-aware_PIT
loss:
  train:
    config:
      perm_reduce: active_mean
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
  val:
    config:
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_se_sisdr
main_args:
  exp_dir: /misc/usrhomes/s1495/TIGER/Experiments/checkpoint/TIGER-ECHI-activity-aware_PIT
optimizer:
  lr: 0.0005
  optim_name: adam
  weight_decay: 0
options:
  conf_dir: configs/tiger_on_ECHI.yml
  help: null
scheduler:
  sche_config: {}
  sche_name: null
training:
  SpeedAug: false
  checkpoint:
    mode: min
    monitor: val_speech_loss
    save_last: true
    save_top_k: 5
    verbose: true
  ckpt_path: null
  early_stop:
    mode: min
    monitor: val_speech_loss
    patience: 20
    verbose: true
  epochs: 500
  gpus:
  - 0
  lambda_res: 0
  parallel: ddp
  pit_activity_tau: 1.0e-06
  system: AudioLightningModuleECHI
