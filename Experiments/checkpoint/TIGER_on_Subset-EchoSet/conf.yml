audionet:
  audionet_config:
    in_channels: 256
    num_blocks: 4
    num_sources: 2
    out_channels: 128
    stride: 160
    upsampling_depth: 5
    win: 640
  audionet_name: TIGER
datamodule:
  data_config:
    batch_size: 1
    n_src: 2
    num_workers: 8
    persistent_workers: false
    pin_memory: true
    sample_rate: 16000
    segment: 3.0
    test_dir: /data/public/EchoSet/test
    train_dir: /data/public/EchoSet/train
    valid_dir: /data/public/EchoSet/val
  data_name: EchoSetDataModule
exp:
  exp_name: TIGER_on_Subset-EchoSet
loss:
  train:
    config:
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
  val:
    config:
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
main_args:
  exp_dir: /misc/usrhomes/s1495/TIGER/Experiments/checkpoint/TIGER_on_Subset-EchoSet
optimizer:
  lr: 0.001
  optim_name: adam
  weight_decay: 0
options:
  conf_dir: configs/tiger_on_Subset_EchoSet.yml
  help: null
scheduler:
  sche_config: {}
  sche_name: null
subset:
  n_test: null
  n_train: null
  n_val: null
  shuffle: false
  test_indices:
  - 8
  train_indices:
  - 8
  val_indices:
  - 8
training:
  SpeedAug: false
  checkpoint:
    mode: min
    monitor: val_loss/dataloader_idx_0
    save_last: true
    save_top_k: 5
    verbose: true
  ckpt_path: null
  early_stop: null
  epochs: 10000
  gpus:
  - 0
  parallel: ddp
  system: AudioLightningModule
