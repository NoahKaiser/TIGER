audionet:
  audionet_config:
    att_hid_chan: 4
    att_kernel_size: 8
    att_n_head: 4
    att_stride: 1
    film_gate_init_logit: -2.0
    film_hidden: 256
    film_init_std: 0.001
    film_scale: 0.1
    in_channels: 256
    num_blocks: 4
    num_sources: 1
    out_channels: 128
    spk_emb_dim: 192
    spk_num_tokens: 8
    spk_token_dim: 128
    spk_token_drop: 0.0
    spk_tokenizer_mode: linear
    stride: 160
    upsampling_depth: 5
    win: 640
  audionet_name: TSE_TIGER_FiLMCross
datamodule:
  data_config:
    batch_size: 2
    has_test_targets: false
    n_src: 4
    num_workers: 8
    only_valid_speech_region: true
    persistent_workers: false
    pin_memory: true
    sample_rate: 16000
    segment: 3.0
    spk_emb_path: /no_backups/s1495/ECHI_spk_embeddings/ECAPA_embeddings/ecapa_embeddings.pt
    test_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/eval
    train_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/train
    valid_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/dev
    valid_speech_metadata_root: /data/public/CHiME9/metadata/ref
    verify_spk_alignment: true
  data_name: TSE_ECHIDataModule
exp:
  exp_name: TSE-TIGER-FiLMCross-ECHI
loss:
  train:
    config: {}
    loss_func: null
    sdr_type: pairwise_neg_sisdr
  val:
    config: {}
    loss_func: null
    sdr_type: pairwise_neg_sisdr
main_args:
  exp_dir: /misc/usrhomes/s1495/TIGER/Experiments/checkpoint/TSE-TIGER-FiLMCross-ECHI
optimizer:
  lr: 0.0001
  optim_name: adam
  weight_decay: 0
options:
  conf_dir: configs/tse_tiger_FiLMCross.yml
  help: null
scheduler:
  sche_config:
    factor: 0.5
    patience: 10
  sche_name: ReduceLROnPlateau
training:
  SpeedAug: false
  checkpoint:
    mode: min
    monitor: val_loss
    save_last: true
    save_top_k: 5
    verbose: true
  ckpt_path: null
  early_stop:
    mode: min
    monitor: val_loss
    patience: 20
    verbose: true
  epochs: 500
  film_warmup_steps: 3000
  gpus:
  - 0
  parallel: ddp
  system: AudioLightningModuleTSE_ECHI
