# First-run TSE_TIGER2 config (explicit residual stream + mask partition).

audionet:
  audionet_name: TSE_TIGER2
  audionet_config:
    out_channels: 160
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 640
    stride: 160
    num_sources: 4
    predict_residual: true # predict an explicit residual output stream (instead of only closure residual)
    enforce_partition: true # enforce TF-mask partition so outputs sum to mixture in the mask domain

loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr_silence_aware
    config:
      pit_from: pw_mtx
      perm_reduce: active_soft_mean
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_se_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false

training:
  system: AudioLightningModuleECHI
  gpus: [0]
  parallel: ddp
  epochs: 500
  early_stop:
    monitor: val_total_loss
    mode: min
    patience: 20
    verbose: true
  SpeedAug: False
  lambda_res: 0.5 # weight for residual-loss term in total loss (higher -> stronger residual matching)
  pit_activity_tau: 1.0e-6 # energy threshold to decide whether a target speaker is active
  pit_activity_gamma: 0.05 # softening factor for PIT active/inactive weighting (lower -> sharper hard-like weights)
  pit_activity_beta: 8.0 # sigmoid slope for activity score from target energy (higher -> steeper active/inactive transition)
  pit_silence_weight: 0.1 # penalty weight for assigning energy to silent target slots
  ckpt_path: Null
  checkpoint:
    monitor: "val_total_loss"
    mode: "min"
    save_top_k: 5
    save_last: true
    verbose: true

optimizer:
  optim_name: adam
  lr: 0.001
  weight_decay: 0

scheduler:
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 10
    factor: 0.5

datamodule:
  data_name: ECHIDataModule
  data_config:
    train_dir: /no_backups/s1495/Processed_ECHI/ha/train
    valid_dir: /no_backups/s1495/Processed_ECHI/ha/dev
    test_dir: /no_backups/s1495/Processed_ECHI/ha/eval
    n_src: 4
    sample_rate: 16000
    segment: 3.0
    batch_size: 4
    num_workers: 8
    pin_memory: true
    persistent_workers: false
    mixture_mode: target_sum #manifest for normal mixtrue mode

exp:
  exp_name: TIGER-TSE2-ECHI_without-Noise
