# Copy of tiger_on_SubsetECHI.yml adapted for TSE_TIGER2 overfit checks.

# Network config
audionet:
  audionet_name: TSE_TIGER2
  audionet_config:
    out_channels: 160
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 640
    stride: 160
    num_sources: 4
    predict_residual: true
    enforce_partition: true

# Loss config
loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr_silence_aware
    config:
      pit_from: pw_mtx
      perm_reduce: active_soft_mean
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_se_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false

# Training config
training:
  system: AudioLightningModuleECHI
  gpus: [0]
  parallel: ddp
  epochs: 100000
  early_stop: null
    # monitor: val_total_loss
    # mode: min
    # patience: 20
    # verbose: true
  SpeedAug: False
  lambda_res: 0.5
  pit_activity_tau: 1.0e-6
  pit_activity_gamma: 0.05
  pit_activity_beta: 8.0
  pit_silence_weight: 0.1
  ckpt_path: Null
  checkpoint:
    monitor: "val_total_loss"
    mode: "min"
    save_top_k: 5
    save_last: true
    verbose: true

# Optim config
optimizer:
  optim_name: adam
  lr: 0.0005
  weight_decay: 0

# Scheduler config
scheduler:
  sche_name: Null
  sche_config: {}
    # patience: 10
    # factor: 0.5

# Data config
datamodule:
  data_name: ECHIDataModule
  data_config:
    train_dir: /no_backups/s1495/Processed_ECHI/ha/train
    valid_dir: /no_backups/s1495/Processed_ECHI/ha/train # validation on overfitted training set
    test_dir: /no_backups/s1495/Processed_ECHI/ha/eval
    n_src: 4
    sample_rate: 16000
    segment: 3.0
    batch_size: 1
    num_workers: 8
    pin_memory: true
    persistent_workers: false

subset:
  train_indices: [8, 1000, 2000, 4000]
  val_indices: [8, 1000, 2000, 4000]
  test_indices: null
  n_train: null
  n_val: null
  n_test: null
  shuffle_train: false

exp:
  exp_name: TIGER_TSE2_on_Subset-ECHI
