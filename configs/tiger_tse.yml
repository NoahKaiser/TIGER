#Copy of tiger-small.yml
# Network config
audionet:
  audionet_name: TSE_TIGER
  audionet_config:
    out_channels: 128
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 640
    stride: 160
    num_sources: 1

# Loss config
loss:
  train:
    loss_func: null
    sdr_type: pairwise_neg_se_sisdr #pairwise_neg_snr
    config: {}
  val:
    loss_func: null
    sdr_type: pairwise_neg_se_sisdr #pairwise_neg_sisdr
    config: {}

# Training config
training:
  system: AudioLightningModuleTSE_ECHI
  gpus: [0]
  parallel: ddp
  epochs: 500
  early_stop:
    monitor: val_loss
    mode: min
    patience: 20
    verbose: true
  SpeedAug: False
  ckpt_path: Null # Null if training from scratch
  checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 5
    save_last: true
    verbose: true


# Optim config
optimizer:
  optim_name: adam
  lr: 0.001 #original lr=0.001, try smaller lr
  weight_decay: 0

# Sche config
scheduler: 
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 10
    factor: 0.5

# Data config
datamodule:
  data_name: TSE_ECHIDataModule
  data_config: #important: add the path to the Preprocessed dataset where the json files are located
    train_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/train
    valid_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/dev
    test_dir: /no_backups/s1495/Processed_TSE_ECHI/ha/eval
    spk_emb_path: /no_backups/s1495/ECHI_spk_embeddings/ECAPA_embeddings/ecapa_embeddings.pt
    n_src: 4 # dataset target positions to sample from (pos1..pos4), not model output sources
    sample_rate: 16000
    segment: 3.0
    #normalize_audio: false
    batch_size: 4
    num_workers: 8
    pin_memory: true
    persistent_workers: false
#speaker_embedding:
  #path: /no_backups/s1495/ECHI_spk_embeddings/ECAPA_embeddings/ecapa_embeddings.pt
  #sort_ids: true
exp:
  exp_name: TSE-TIGER-on-ECHI_Test
